name: Build VerbyOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build \
            xorriso \
            squashfs-tools \
            debootstrap \
            dosfstools \
            mtools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            ca-certificates \
            rsync

      - name: Make build script executable
        run: chmod +x build.sh config/auto/config

      - name: Build ISO
        run: sudo ./build.sh

      - name: Verify ISO
        run: |
          test -s VerbyOS.iso
          test -s VerbyOS.iso.sha256
          sha256sum -c VerbyOS.iso.sha256
          file VerbyOS.iso
          xorriso -indev VerbyOS.iso -toc

      - name: Upload VerbyOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: VerbyOS-ISO
          path: |
            VerbyOS.iso
            VerbyOS.iso.sha256