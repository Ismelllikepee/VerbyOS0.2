name: Build VerbyOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build xorriso squashfs-tools debootstrap dosfstools mtools \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            ca-certificates git rsync
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ISO
        run: ./build.sh
      - name: Verify artifacts
        run: |
          test -s VerbyOS.iso
          test -s VerbyOS.iso.sha256
          sha256sum -c VerbyOS.iso.sha256
          xorriso -indev VerbyOS.iso -toc >/tmp/verbyos-toc.txt
          grep -q 'VERBYOS' /tmp/verbyos-toc.txt || true
      - name: Upload VerbyOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: VerbyOS-ISO
          path: |
            VerbyOS.iso
            VerbyOS.iso.sha256
